<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CodeCrack</title>
<style>
:root{
  --bg:#14161a;--panel:#1d2025;--line:#363c44;--ti:#aeb4bb;--ink:#eceae4;--mute:#8f969e;
  --brass:#c9a45c;--brass2:#ecd08e;--low:#7fa0bd;--high:#d58a66;--err:#e0806a;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#e8e9eb;--panel:#f6f6f3;--line:#c3c7cd;--ti:#6b727a;--ink:#1b1d21;--mute:#5a6169;
    --brass:#8f6a22;--brass2:#b88a2c;--low:#3d678c;--high:#a2492a;--err:#a23b27;
  }
}
:root[data-theme="light"]{
  --bg:#e8e9eb;--panel:#f6f6f3;--line:#c3c7cd;--ti:#6b727a;--ink:#1b1d21;--mute:#5a6169;
  --brass:#8f6a22;--brass2:#b88a2c;--low:#3d678c;--high:#a2492a;--err:#a23b27;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:440px;padding:32px 20px 40px;text-align:center}
h1{margin:0;font-family:Baskerville,"Iowan Old Style",Palatino,Georgia,serif;font-weight:500;
  font-size:clamp(2.4rem,9vw,3.2rem);letter-spacing:.02em}
.sub{margin:8px auto 0;color:var(--mute);font-size:.95rem;max-width:30ch;line-height:1.45}
.dial{display:block;width:min(88vw,340px);height:auto;margin:22px auto 6px;
  filter:drop-shadow(0 14px 22px rgba(0,0,0,.35));transition:filter .6s}
.dial.open{filter:drop-shadow(0 0 22px color-mix(in srgb,var(--brass2) 55%,transparent))}
#needle{transform-origin:150px 150px;transform:rotate(-150deg);transition:transform 1.1s cubic-bezier(.3,1.25,.4,1)}
#range{transition:d .5s}
#shown{font-family:Baskerville,"Iowan Old Style",Palatino,Georgia,serif;font-size:42px;font-variant-numeric:tabular-nums}
#msg{min-height:3em;margin:6px 0 14px;font-size:1.05rem;line-height:1.4}
#msg b{font-weight:600}
.low{color:var(--low)}.high{color:var(--high)}.err{color:var(--err)}.win{color:var(--brass2)}
form{display:flex;gap:10px;justify-content:center}
input{width:7.5em;padding:13px 12px;font:inherit;font-size:1.25rem;text-align:center;color:var(--ink);
  background:var(--panel);border:1px solid var(--line);border-radius:10px;font-variant-numeric:tabular-nums}
input:disabled{opacity:.5}
button{padding:13px 22px;font:inherit;font-weight:600;color:#1a1408;border:0;border-radius:10px;cursor:pointer;
  background:linear-gradient(180deg,var(--brass2),var(--brass))}
input:focus-visible,button:focus-visible{outline:2px solid var(--brass2);outline-offset:3px}
.pips{display:flex;justify-content:center;gap:8px;margin:22px 0 14px}
.pips i{width:12px;height:12px;border-radius:50%;border:1px solid var(--ti);transition:background .3s,border-color .3s}
.pips i.used{background:var(--brass);border-color:var(--brass)}
.hist{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:34px}
.hist span{padding:5px 11px;border:1px solid var(--line);border-radius:999px;font-size:.9rem;
  font-variant-numeric:tabular-nums;background:var(--panel)}
.hist span small{margin-left:6px;font-size:.78rem}
.best{margin-top:18px;color:var(--mute);font-size:.85rem}
@media (prefers-reduced-motion: reduce){#needle,#range,.dial,.pips i{transition:none}}
</style>
</head>
<body>
<main>
  <h1>CodeCrack</h1>
  <p class="sub">A secret code between 1 and 100. You have seven tries to crack it.</p>

  <svg class="dial" id="dial" viewBox="0 0 300 300" role="img" aria-label="Combination dial showing the remaining range">
    <defs>
      <radialGradient id="face" cx="50%" cy="38%" r="75%">
        <stop offset="0" style="stop-color:var(--panel)"/>
        <stop offset="1" style="stop-color:var(--bg)"/>
      </radialGradient>
      <linearGradient id="bezel" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" style="stop-color:var(--ti)"/>
        <stop offset=".5" style="stop-color:var(--line)"/>
        <stop offset="1" style="stop-color:var(--ti)"/>
      </linearGradient>
    </defs>
    <circle cx="150" cy="150" r="146" fill="url(#bezel)"/>
    <circle cx="150" cy="150" r="140" fill="url(#face)"/>
    <g id="ticks"></g>
    <path id="range" fill="none" stroke="var(--brass)" stroke-width="4" stroke-linecap="round"/>
    <g id="needle">
      <polygon points="147,108 153,108 150,34" fill="var(--brass2)"/>
      <rect x="148.5" y="150" width="3" height="26" fill="var(--brass)"/>
    </g>
    <circle cx="150" cy="150" r="46" fill="var(--panel)" stroke="var(--brass)" stroke-width="2"/>
    <text id="shown" x="150" y="165" text-anchor="middle" fill="var(--ink)">?</text>
  </svg>

  <div id="msg" role="status" aria-live="polite">Enter your first guess.</div>

  <form id="f" autocomplete="off">
    <input id="g" type="number" inputmode="numeric" min="1" max="100" step="1" aria-label="Your guess" placeholder="1–100">
    <button id="b" type="submit">Try code</button>
  </form>

  <div class="pips" id="pips" aria-label="Tries used"></div>
  <div class="hist" id="hist"></div>
  <div class="best" id="best"></div>
</main>

<script>
(function(){
  var N=100, MAX=7, A0=-150, SW=300;
  var $=function(s){return document.querySelector(s)};
  var ang=function(n){return A0+(n-1)/(N-1)*SW};
  var pt=function(r,d){var a=(d-90)*Math.PI/180;return [150+r*Math.cos(a),150+r*Math.sin(a)]};
  var NS="http://www.w3.org/2000/svg";

  // dial ticks and numerals
  var ticks=$("#ticks");
  for(var n=1;n<=N;n++){
    var major=(n%10===0), d=ang(n);
    var p1=pt(major?124:128,d), p2=pt(134,d);
    var l=document.createElementNS(NS,"line");
    l.setAttribute("x1",p1[0]);l.setAttribute("y1",p1[1]);l.setAttribute("x2",p2[0]);l.setAttribute("y2",p2[1]);
    l.setAttribute("stroke",major?"var(--ti)":"var(--line)");l.setAttribute("stroke-width",major?2:1);
    ticks.appendChild(l);
    if(major){
      var t=document.createElementNS(NS,"text"), q=pt(106,d);
      t.setAttribute("x",q[0]);t.setAttribute("y",q[1]+4);t.setAttribute("text-anchor","middle");
      t.setAttribute("font-size","11");t.setAttribute("fill","var(--mute)");t.textContent=n;
      ticks.appendChild(t);
    }
  }
  function arc(a,b){
    var s=pt(138,a), e=pt(138,b), big=(b-a)>180?1:0;
    return "M"+s[0]+" "+s[1]+" A138 138 0 "+big+" 1 "+e[0]+" "+e[1];
  }

  var secret, lo, hi, tries, over, tried;
  var needle=$("#needle"), msg=$("#msg"), inp=$("#g"), btn=$("#b"), dial=$("#dial");

  function best(){try{return parseInt(localStorage.getItem("codecrack-best"),10)||0}catch(e){return 0}}
  function saveBest(n){try{localStorage.setItem("codecrack-best",n)}catch(e){}}
  function showBest(){var b=best();$("#best").textContent=b?"Fastest crack: "+b+(b===1?" try":" tries"):""}
  function setMsg(html,cls){msg.className=cls||"";msg.innerHTML=html}

  function draw(){
    $("#range").setAttribute("d",arc(ang(lo),Math.max(ang(hi),ang(lo)+.5)));
    var pips=$("#pips");pips.innerHTML="";
    for(var i=0;i<MAX;i++){var s=document.createElement("i");if(i<tries)s.className="used";pips.appendChild(s)}
    $("#hist").innerHTML=tried.map(function(t){
      return '<span>'+t.n+'<small class="'+t.dir+'">'+t.dir+'</small></span>';
    }).join("");
  }

  function reset(){
    secret=1+Math.floor(Math.random()*N);lo=1;hi=N;tries=0;over=false;tried=[];
    dial.classList.remove("open");
    inp.disabled=false;inp.value="";btn.textContent="Try code";
    $("#shown").textContent="?";
    setMsg("Enter your first guess.");
    draw();showBest();
    needle.style.transform="rotate("+A0+"deg)";
    inp.focus();
  }

  function finish(win){
    over=true;inp.disabled=true;btn.textContent="New code";
    if(win){
      dial.classList.add("open");
      setMsg("Cracked in <b>"+tries+"</b> "+(tries===1?"try":"tries")+".","win");
      var b=best();if(!b||tries<b){saveBest(tries);showBest()}
    }else{
      setMsg("Out of tries. The code was <b>"+secret+"</b>.","err");
      needle.style.transform="rotate("+ang(secret)+"deg)";
      $("#shown").textContent=secret;
    }
    btn.focus();
  }

  $("#f").addEventListener("submit",function(e){
    e.preventDefault();
    if(over){reset();return}
    var g=Number(inp.value);
    if(inp.value===""||!Number.isInteger(g)||g<1||g>N){setMsg("Enter a whole number from 1 to 100.","err");return}
    if(tried.some(function(t){return t.n===g})){setMsg("You already tried "+g+". Pick another number.","err");return}
    tries++;
    needle.style.transform="rotate("+ang(g)+"deg)";
    $("#shown").textContent=g;
    inp.value="";
    if(g===secret){tried.push({n:g,dir:"win"});draw();finish(true);return}
    if(g<secret){lo=Math.max(lo,g+1);tried.push({n:g,dir:"low"});
      setMsg("<b>"+g+"</b> is too low. The code is between "+lo+" and "+hi+".","low")}
    else{hi=Math.min(hi,g-1);tried.push({n:g,dir:"high"});
      setMsg("<b>"+g+"</b> is too high. The code is between "+lo+" and "+hi+".","high")}
    draw();
    if(tries>=MAX)finish(false);else inp.focus();
  });

  reset();
  // opening sweep: the dial spins through its full range once
  if(!window.matchMedia("(prefers-reduced-motion: reduce)").matches){
    setTimeout(function(){if(!tries)needle.style.transform="rotate("+(A0+SW)+"deg)"},250);
    setTimeout(function(){if(!tries)needle.style.transform="rotate("+A0+"deg)"},1500);
  }
})();
</script>
</body>
</html>
